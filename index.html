<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Labs Command Center 360 - Oficina virtual SaaS de la red comercial de Labs24k.">
<meta name="theme-color" content="#0B0F19">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230B0F19'/%3E%3Cpath d='M17 5L9 19h6l-1.5 8L23 13h-7z' fill='%233B82F6'/%3E%3C/svg%3E">
<title>Labs Command Center 360 | Labs24k</title>
<style>
/* ==========================================================================
   LABS COMMAND CENTER 360 - Hoja de estilos corporativa Labs24k
   Sin dependencias externas. Preparada para hosting compartido (Hostalia).
   ========================================================================== */
:root{
  --bg:#0B0F19;
  --panel:#111827;
  --card:#1E293B;
  --card-2:#0F172A;
  --line:#1F2937;
  --line-soft:rgba(148,163,184,.14);
  --txt:#E5E7EB;
  --txt-2:#94A3B8;
  --txt-3:#64748B;
  --blue:#3B82F6;
  --blue-d:#1D4ED8;
  --green:#10B981;
  --amber:#F59E0B;
  --red:#EF4444;
  --violet:#8B5CF6;
  --cyan:#06B6D4;
  --r:16px;
  --r-sm:10px;
  --sidebar:272px;
  --shadow:0 10px 30px -12px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--txt);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--blue);text-decoration:none}
svg{display:block}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#243044;border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:#334155}

/* ---------- LOGIN ---------- */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(1000px 600px at 15% 0%,rgba(59,130,246,.16),transparent 60%),
             radial-gradient(900px 600px at 100% 100%,rgba(16,185,129,.12),transparent 60%),var(--bg)}
.login-card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);
  border-radius:22px;padding:34px;box-shadow:var(--shadow)}
.login-card h1{font-size:26px;margin:0 0 4px;letter-spacing:.14em}
.login-card .sub{color:var(--txt-2);font-size:13px;margin:0 0 26px}
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.role-opt{border:1px solid var(--line);background:var(--card-2);border-radius:var(--r-sm);
  padding:12px;text-align:left;transition:.16s}
.role-opt:hover{border-color:rgba(59,130,246,.5)}
.role-opt.on{border-color:var(--blue);background:rgba(59,130,246,.12);box-shadow:0 0 0 1px var(--blue) inset}
.role-opt strong{display:block;font-size:13px;color:#fff}
.role-opt span{font-size:11px;color:var(--txt-3)}

/* ---------- LAYOUT ---------- */
.app{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar);flex:0 0 var(--sidebar);background:var(--panel);
  border-right:1px solid var(--line);display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh}
.brand{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;
  justify-content:space-between;gap:8px}
.brand h1{font-size:17px;font-weight:800;letter-spacing:.16em;margin:0;color:var(--blue)}
.brand h1 span{color:#fff}
.badge-role{font-size:10px;text-transform:uppercase;letter-spacing:.06em;padding:4px 8px;border-radius:6px;
  background:rgba(59,130,246,.14);color:#93C5FD;border:1px solid rgba(59,130,246,.3);white-space:nowrap}
.nav{flex:1;overflow-y:auto;padding:14px 12px}
.nav-sec{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--txt-3);
  padding:14px 12px 6px}
.nav-item{width:100%;display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;
  color:var(--txt-2);font-size:13.5px;font-weight:500;transition:.15s;text-align:left;margin-bottom:2px}
.nav-item:hover{background:rgba(148,163,184,.08);color:#E2E8F0}
.nav-item.on{background:var(--blue);color:#fff;box-shadow:0 8px 20px -8px rgba(59,130,246,.9)}
.nav-item .dot{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;
  border-radius:20px;padding:1px 7px}
.nav-item.on .dot{background:rgba(255,255,255,.25)}
.user-card{border-top:1px solid var(--line);padding:14px;background:rgba(15,23,42,.5);
  display:flex;align-items:center;gap:11px}
.avatar{width:38px;height:38px;flex:0 0 38px;border-radius:50%;background:rgba(59,130,246,.18);
  border:1px solid rgba(59,130,246,.35);color:#93C5FD;font-weight:700;display:flex;
  align-items:center;justify-content:center}
.user-card .nm{font-size:13px;font-weight:600;color:#fff}
.user-card .ph{font-size:11.5px;color:var(--txt-2)}
.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:62px;border-bottom:1px solid var(--line);background:rgba(17,24,39,.86);
  backdrop-filter:blur(8px);padding:0 24px;display:flex;align-items:center;gap:16px;
  position:sticky;top:0;z-index:20}
.topbar h2{font-size:16px;font-weight:600;color:#fff;margin:0}
.topbar .crumb{font-size:11px;color:var(--txt-3)}
.spacer{flex:1}
.pill-live{font-size:11px;color:#6EE7B7;background:rgba(6,78,59,.4);border:1px solid rgba(6,95,70,.6);
  padding:5px 11px;border-radius:20px;display:flex;align-items:center;gap:7px;white-space:nowrap}
.blip{width:7px;height:7px;border-radius:50%;background:var(--green);animation:blip 1.6s infinite}
@keyframes blip{0%,100%{opacity:1}50%{opacity:.25}}
.search{display:flex;align-items:center;gap:8px;background:var(--card-2);border:1px solid var(--line);
  border-radius:10px;padding:7px 12px;width:280px;color:var(--txt-3)}
.search input{background:none;border:none;outline:none;width:100%;font-size:13px}
.icon-btn{width:34px;height:34px;border-radius:10px;background:var(--card-2);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;color:var(--txt-2);transition:.15s;position:relative}
.icon-btn:hover{color:#fff;border-color:#334155}
.icon-btn .n{position:absolute;top:-5px;right:-5px;background:var(--red);color:#fff;font-size:9px;
  font-weight:700;border-radius:10px;padding:1px 5px}
.burger{display:none}
.content{padding:24px;flex:1}
.view{max-width:1480px;margin:0 auto;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- PRIMITIVAS ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card.flat{background:rgba(30,41,59,.6)}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.card-h h3{margin:0;font-size:14.5px;font-weight:600;color:#fff}
.card-h h3 svg{display:inline-block;vertical-align:-3px;margin-right:5px}
.card-h p{margin:3px 0 0;font-size:12px;color:var(--txt-3)}
.chip{font-size:11px;padding:4px 10px;border-radius:20px;border:1px solid var(--line-soft);
  background:var(--card-2);color:var(--txt-2);white-space:nowrap}
.chip.blue{background:rgba(59,130,246,.12);color:#93C5FD;border-color:rgba(59,130,246,.32)}
.chip.green{background:rgba(16,185,129,.12);color:#6EE7B7;border-color:rgba(16,185,129,.32)}
.chip.amber{background:rgba(245,158,11,.12);color:#FCD34D;border-color:rgba(245,158,11,.32)}
.chip.red{background:rgba(239,68,68,.12);color:#FCA5A5;border-color:rgba(239,68,68,.32)}
.chip.violet{background:rgba(139,92,246,.12);color:#C4B5FD;border-color:rgba(139,92,246,.32)}
.btn{padding:9px 16px;border-radius:11px;font-size:12.5px;font-weight:600;display:inline-flex;
  align-items:center;gap:8px;transition:.15s;white-space:nowrap}
.btn-p{background:var(--blue);color:#fff;box-shadow:0 8px 18px -8px rgba(59,130,246,.9)}
.btn-p:hover{background:#2563EB}
.btn-g{background:var(--green);color:#04231A;box-shadow:0 8px 18px -8px rgba(16,185,129,.9)}
.btn-g:hover{background:#059669;color:#fff}
.btn-s{background:#1F2937;color:#CBD5E1;border:1px solid var(--line)}
.btn-s:hover{background:#273244;color:#fff}
.btn-xs{padding:6px 11px;border-radius:9px;font-size:11.5px;font-weight:600}
.grid{display:grid;gap:16px}
.g-2{grid-template-columns:repeat(2,1fr)}
.g-3{grid-template-columns:repeat(3,1fr)}
.g-4{grid-template-columns:repeat(4,1fr)}
.g-hero{grid-template-columns:1.15fr 1fr 1fr}
.g-21{grid-template-columns:2fr 1fr}
.g-cal{grid-template-columns:1.3fr 1fr}
.g-sideR{grid-template-columns:1fr 380px}
.g-sideL{grid-template-columns:340px 1fr}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:10px}
.muted{color:var(--txt-3)}
.small{font-size:12px}
.tiny{font-size:11px}
.up{color:#6EE7B7}
.down{color:#FCA5A5}
.delta{font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px;display:inline-flex;align-items:center;gap:4px}
.delta.up{background:rgba(16,185,129,.14)}
.delta.down{background:rgba(239,68,68,.14)}

/* formularios */
label.f{display:block;font-size:11.5px;font-weight:500;color:var(--txt-2);margin-bottom:6px}
.inp{width:100%;background:var(--card-2);border:1px solid #29354a;border-radius:11px;
  padding:10px 13px;font-size:13px;outline:none;transition:.15s}
.inp:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.14)}
select.inp{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' fill='none' stroke='%2394A3B8' stroke-width='2'><path d='M3 5l4 4 4-4'/></svg>");
  background-repeat:no-repeat;background-position:right 12px center;padding-right:34px}
.field{margin-bottom:14px}

/* tablas */
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;
  color:var(--txt-3);font-weight:600;padding:11px 14px;background:rgba(15,23,42,.6);
  border-bottom:1px solid var(--line)}
.tbl td{padding:13px 14px;font-size:13px;border-bottom:1px solid rgba(31,41,55,.7)}
.tbl tbody tr:hover{background:rgba(148,163,184,.05)}
.tbl tbody tr:last-child td{border-bottom:none}
.tbl .w{color:#fff;font-weight:500}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}

/* barras de progreso */
.bar{height:6px;border-radius:6px;background:rgba(148,163,184,.14);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:6px;background:var(--blue);transition:width .5s}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px}
.legend div{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--txt-2)}
.legend i{width:8px;height:8px;border-radius:3px;display:block}
.stackbar{display:flex;height:9px;border-radius:6px;overflow:hidden;background:rgba(148,163,184,.1)}
.stackbar i{display:block;height:100%}

/* KPI */
.kpi .lbl{font-size:12px;color:var(--txt-2);display:flex;align-items:center;gap:7px}
.kpi .val{font-size:29px;font-weight:700;color:#fff;letter-spacing:-.02em;margin:8px 0 2px}
.ico-box{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--line-soft);background:var(--card-2)}
.ico-box.blue{background:rgba(59,130,246,.14);color:#93C5FD;border-color:rgba(59,130,246,.3)}
.ico-box.green{background:rgba(16,185,129,.14);color:#6EE7B7;border-color:rgba(16,185,129,.3)}
.ico-box.violet{background:rgba(139,92,246,.14);color:#C4B5FD;border-color:rgba(139,92,246,.3)}
.ico-box.amber{background:rgba(245,158,11,.14);color:#FCD34D;border-color:rgba(245,158,11,.3)}
.ico-box.cyan{background:rgba(6,182,212,.14);color:#67E8F9;border-color:rgba(6,182,212,.3)}
.ico-box.red{background:rgba(239,68,68,.14);color:#FCA5A5;border-color:rgba(239,68,68,.3)}

/* listas rank */
.rank{display:flex;flex-direction:column;gap:14px}
.rank-it{display:flex;align-items:center;gap:12px}
.rank-it .nm{font-size:12.5px;color:#E2E8F0}
.rank-it .vl{margin-left:auto;font-size:12px;color:var(--txt-2);font-weight:600}

/* timeline */
.tl{position:relative;padding-left:22px}
.tl:before{content:'';position:absolute;left:6px;top:4px;bottom:4px;width:1px;background:var(--line)}
.tl-it{position:relative;padding-bottom:16px}
.tl-it:last-child{padding-bottom:0}
.tl-it:before{content:'';position:absolute;left:-19px;top:5px;width:9px;height:9px;border-radius:50%;
  background:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.18)}
.tl-it.g:before{background:var(--green);box-shadow:0 0 0 3px rgba(16,185,129,.18)}
.tl-it.a:before{background:var(--amber);box-shadow:0 0 0 3px rgba(245,158,11,.18)}

/* embudo kanban */
.kan{display:grid;grid-template-columns:repeat(5,minmax(190px,1fr));gap:14px;overflow-x:auto;padding-bottom:6px}
.kan-col{background:rgba(15,23,42,.6);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:190px}
.kan-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;font-size:12px;
  font-weight:600;color:#E2E8F0}
.kan-card{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:11px;margin-bottom:9px;
  transition:.15s;cursor:pointer}
.kan-card:hover{border-color:rgba(59,130,246,.5);transform:translateY(-1px)}
.kan-card .t{font-size:12.5px;color:#fff;font-weight:500;margin-bottom:5px}

/* calendario */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dow{font-size:10.5px;text-transform:uppercase;color:var(--txt-3);text-align:center;padding:4px 0;letter-spacing:.06em}
.cal .day{aspect-ratio:1;border:1px solid var(--line);border-radius:10px;background:var(--card-2);
  padding:6px;font-size:12px;color:var(--txt-2);position:relative;transition:.15s}
.cal .day:hover{border-color:rgba(59,130,246,.5)}
.cal .day.out{opacity:.28}
.cal .day.today{border-color:var(--blue);background:rgba(59,130,246,.12);color:#fff;font-weight:600}
.cal .day .ev{position:absolute;left:6px;right:6px;bottom:6px;display:flex;gap:3px}
.cal .day .ev i{width:5px;height:5px;border-radius:50%;background:var(--blue);display:block}
.cal .day .ev i.g{background:var(--green)}
.cal .day .ev i.a{background:var(--amber)}

/* academia */
.prog-ring{position:relative;width:64px;height:64px}
.mod-card{background:rgba(30,41,59,.6);border:1px solid var(--line);border-radius:var(--r);padding:18px;
  display:flex;flex-direction:column;justify-content:space-between;transition:.16s}
.mod-card:hover{border-color:rgba(59,130,246,.5);transform:translateY(-2px)}

/* documento presupuesto */
.doc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:26px}
.doc-h{display:flex;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);
  padding-bottom:18px;margin-bottom:18px}
.doc-line{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px dashed rgba(148,163,184,.16);font-size:13px}
.doc-total{display:flex;justify-content:space-between;align-items:center;background:var(--card-2);
  border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:14px}

/* toast */
.toast{position:fixed;right:20px;bottom:20px;z-index:100;background:var(--card);
  border:1px solid rgba(16,185,129,.4);border-left:3px solid var(--green);border-radius:12px;
  padding:13px 17px;font-size:13px;color:#D1FAE5;box-shadow:var(--shadow);animation:slide .25s ease}
@keyframes slide{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}

/* modal */
.ov{position:fixed;inset:0;background:rgba(2,6,16,.72);backdrop-filter:blur(3px);z-index:90;
  display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .2s}
.modal{width:100%;max-width:520px;background:var(--card);border:1px solid var(--line);
  border-radius:18px;padding:24px;box-shadow:var(--shadow);max-height:88vh;overflow-y:auto}

/* responsive */
@media(max-width:1300px){.g-hero{grid-template-columns:1fr 1fr}.g-hero>.card:first-child{grid-column:1/-1}}
@media(max-width:1200px){.g-4{grid-template-columns:repeat(2,1fr)}
  .g-sideR,.g-sideL,.g-21,.g-cal{grid-template-columns:1fr}}
@media(max-width:1024px){
  .sidebar{position:fixed;left:0;top:0;z-index:60;transform:translateX(-100%);transition:.25s}
  .sidebar.open{transform:none;box-shadow:0 0 60px rgba(0,0,0,.7)}
  .burger{display:flex}
  .search{display:none}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:55}
}
@media(max-width:860px){
  .g-3,.g-2,.g-hero{grid-template-columns:1fr}
  .content{padding:16px}
  .kpi .val{font-size:24px}
  .doc{padding:18px}
}
@media(max-width:600px){
  .g-4{grid-template-columns:1fr}
  .topbar{padding:0 14px}
  .topbar h2{font-size:14px}
  .role-grid{grid-template-columns:1fr}
}

/* ==========================================================================
   MODULO DE PRESUPUESTOS: catalogo, documento formal y hoja de ruta
   ========================================================================== */
.pack-list{padding-right:2px}
.pack{background:var(--card-2);border:1px solid var(--line);border-radius:14px;padding:13px;
  margin-bottom:9px;cursor:pointer;transition:.15s}
.pack:hover{border-color:#334155}
.pack.on{border-color:var(--blue);background:rgba(30,58,138,.22);box-shadow:0 8px 22px -14px rgba(59,130,246,.9)}
.pack:focus-visible,.kan-card:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:.94em;letter-spacing:.01em}
.btn.on-tab{background:var(--blue);color:#fff;border-color:var(--blue)}
.rec{color:#6EE7B7}

/* ---------- DOCUMENTO ---------- */
.doc.pdf{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:30px}
.doc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
  padding-bottom:16px;border-bottom:2px solid var(--blue)}
.doc-brand{font-size:20px;font-weight:800;letter-spacing:.14em;color:var(--blue)}
.doc-brand span{color:var(--txt)}
.doc-kicker{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--blue)}
.doc-title{font-size:22px;line-height:1.25;font-weight:700;color:var(--txt);margin:22px 0 6px;
  text-wrap:balance;max-width:62ch}
.doc-lead{font-size:13px;color:var(--txt-2);max-width:72ch;margin:0 0 18px}
.doc-meta{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:14px 0;margin:16px 0;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.doc-meta .k,.doc-parties .k,.doc-sign .k{display:block;font-size:10px;text-transform:uppercase;
  letter-spacing:.09em;color:var(--txt-3);margin-bottom:4px}
.doc-meta .v{font-size:13px;font-weight:600;color:var(--txt)}
.doc-parties{display:grid;grid-template-columns:1fr 1fr;gap:16px;background:var(--card-2);
  border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:20px}
.doc-parties .v.big{font-size:15px;font-weight:700;color:var(--txt)}
.doc-parties .tel{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;
  color:var(--blue);margin:3px 0 2px}
.doc-hero{text-align:center;border:1px solid rgba(59,130,246,.4);border-radius:14px;padding:20px;
  margin:6px 0 24px;background:linear-gradient(180deg,rgba(59,130,246,.14),rgba(59,130,246,0))}
.doc-hero .amount{font-size:36px;font-weight:800;color:var(--txt);letter-spacing:-.02em;margin:6px 0 4px;
  font-variant-numeric:tabular-nums}
.doc-sec{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700;text-transform:uppercase;
  letter-spacing:.1em;color:var(--txt-2);margin:26px 0 12px}
.doc-sec .n{width:22px;height:22px;border-radius:6px;background:var(--blue);color:#fff;display:flex;
  align-items:center;justify-content:center;font-size:12px;letter-spacing:0}
.doc-tbl td{vertical-align:top}
.doc-tbl td,.doc-tbl th{font-variant-numeric:tabular-nums}
.doc-sum{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:18px}
.doc-sum .l{display:flex;justify-content:space-between;gap:16px;padding:11px 16px;font-size:13px;
  border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.doc-sum .l:last-child{border-bottom:none}
.doc-sum .l.tot{background:var(--card-2);font-size:16px;font-weight:800;color:var(--txt);
  border-top:2px solid var(--blue)}
.doc-box{background:var(--card-2);border:1px solid var(--line);border-left:3px solid var(--blue);
  border-radius:10px;padding:15px;margin-bottom:16px}
.doc-box .bt{font-size:12.5px;font-weight:700;color:var(--txt);margin-bottom:8px}
.doc-box .li{font-size:12.5px;color:var(--txt-2);margin-bottom:5px}
.doc-note{font-size:11.5px;color:var(--txt-3);line-height:1.6;padding:12px 0;border-top:1px dashed var(--line)}
.doc-why{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.doc-why>div{text-align:center;padding:14px;border:1px solid var(--line);border-radius:12px}
.doc-why .ok{color:var(--green);display:flex;justify-content:center;margin-bottom:8px}
.doc-why .t{font-size:12.5px;font-weight:700;color:var(--txt);margin-bottom:4px}
.doc-sign{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin:28px 0 10px}
.doc-sign .line{height:34px;border-bottom:1px solid var(--txt-3);margin:6px 0 8px}
.doc-sign .v{font-size:13px;font-weight:600;color:var(--txt)}
.doc-foot{font-size:10.5px;color:var(--txt-3);text-align:center;padding-top:14px;
  border-top:1px solid var(--line);margin-top:16px;line-height:1.6}

/* ---------- HOJA DE RUTA ---------- */
.week{background:var(--card-2);border:1px solid var(--line);border-radius:14px;padding:16px}
.week .wh{display:flex;align-items:center;gap:11px;margin-bottom:10px}
.week .wn{width:30px;height:30px;flex:0 0 30px;border-radius:9px;background:var(--blue);color:#fff;
  font-weight:800;display:flex;align-items:center;justify-content:center}
.week .wt{font-size:14px;font-weight:700;color:var(--txt)}
.week .wl{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--txt-2);margin:8px 0}
.week .wl svg{flex:0 0 auto;color:var(--green);margin-top:2px}
.week .wr{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);font-size:12px;
  font-weight:600;color:var(--blue)}

@media(max-width:1000px){
  .doc-meta,.doc-why{grid-template-columns:repeat(2,1fr)}
  .doc-parties,.doc-sign{grid-template-columns:1fr}
}
@media(max-width:600px){
  .doc.pdf{padding:18px}
  .doc-meta,.doc-why{grid-template-columns:1fr}
  .doc-hero .amount{font-size:27px}
  .doc-title{font-size:18px}
}

@media print{
  @page{size:A4;margin:12mm}

    --bg:#fff; --panel:#fff; --card:#fff; --card-2:#F8FAFC; --line:#D9E0EA;

  .doc-sign,.doc-parties{display:grid!important;grid-template-columns:1fr 1fr!important}
  .doc-meta{display:grid!important;grid-template-columns:repeat(2,1fr)!important;gap:10px 24px}
  /* compactado para que la propuesta entre en el minimo de paginas */
  body{font-size:12px}

  .doc-hero .amount{font-size:30px}
  .doc-sec{margin:18px 0 9px}
  .tbl td{padding:9px 10px}
  .tbl th{padding:8px 10px}
  .doc-sum .l{padding:8px 12px}
  .doc-sign{margin:20px 0 8px}
  /* texto blanco del tema oscuro: en papel debe ser tinta */
  .doc .w,.doc-tbl .w,.tbl .w{color:#0B0F19!important}

  a{color:#1D4ED8!important;text-decoration:none}
}

function areaChart(data, opt){

  var rng = (max-min)||1, id = 'g'+Math.random().toString(36).slice(2,8);

  var pts = data.map(function(v,i){

    var y = h-pad-((v-min)/rng)*(h-pad*2);
    return [x,y];
  });
  var line = pts.map(function(p,i){ return (i?'L':'M')+p[0].toFixed(2)+' '+p[1].toFixed(2); }).join(' ');
  var area = line+' L'+w+' '+h+' L0 '+h+' Z';
  return '<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" style="width:100%;height:'+(opt.px||70)+'px">'+
    '<defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0%" stop-color="'+col+'" stop-opacity=".38"/>'+
    '<stop offset="100%" stop-color="'+col+'" stop-opacity="0"/></linearGradient></defs>'+

      '<div style="width:100%;height:'+h+'px;display:flex;align-items:flex-end">'+

      '<span style="font-size:10px;color:var(--txt-3)" class="trunc">'+esc(labels[i])+'</span></div>';

  return '<div style="display:flex;align-items:flex-end;gap:6px">'+bars+'</div>';

/* ------------------------------ PERSISTENCIA LOCAL ---------------------- */
/* Guarda el estado de la sesión de demostración en el navegador (localStorage)
   para que no se pierda al recargar la página. No hay backend: es un espejo
   local, no una fuente de datos compartida entre usuarios. */
var STORAGE_KEY = 'labs360_state_v1';
function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({S:S, DB:DB, PRE:PRE, INT:INT}));
  }catch(e){ /* almacenamiento no disponible (modo privado, cuota, etc.) */ }
}
function loadState(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return;
    var saved = JSON.parse(raw);
    if(saved.S) Object.assign(S, saved.S, {sidebar:false});
    if(saved.DB) Object.assign(DB, saved.DB);
    if(saved.PRE) Object.assign(PRE, saved.PRE);
    if(saved.INT) Object.assign(INT, saved.INT);
  }catch(e){ /* datos guardados corruptos: se ignoran y se sigue con los de demo */ }
}

function viewCalendar(v){
  var y=2026, m=8; /* Septiembre 2026: mes de referencia de la agenda de demostración */
  var real = new Date();
  var todayD = (real.getFullYear()===y && real.getMonth()===m) ? real.getDate() : null;
  var first = new Date(y,m,1).getDay(); first = (first+6)%7;
  var days = new Date(y,m+1,0).getDate();
  var cells='';
  ['L','M','X','J','V','S','D'].forEach(function(d){ cells+='<div class="dow">'+d+'</div>'; });
  for(var i=0;i<first;i++) cells+='<div class="day out"></div>';
  for(var d=1;d<=days;d++){
    var evs = DB.appointments.filter(function(a){ return a.d===d; });
    var dots = evs.length ? '<div class="ev">'+evs.map(function(e){
      return '<i class="'+(e.k==='green'?'g':e.k==='amber'?'a':'')+'"></i>'; }).join('')+'</div>' : '';

      '<div class="tiny muted" style="margin-top:5px">'+a.d+' sep</div></div></div>';

function eur2(n){ return new Intl.NumberFormat('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2,useGrouping:true}).format(n)+' €'; }
function allItems(){ var r=[]; CATALOGO.forEach(function(g){ r=r.concat(g.items); }); return r; }
function selLines(){ return allItems().filter(function(i){ return PRE.sel[i.id]; }); }
function preTotales(){
  var L = selLines();
  var base = L.reduce(function(a,b){ return a+b.p; },0);
  var mens = L.reduce(function(a,b){ return a+b.m; },0);
  var dto = base*(PRE.desc/100);
  var sub = base-dto;
  var iva = sub*(PRE.iva/100);
  return {L:L, base:base, mens:mens, dto:dto, sub:sub, iva:iva, tot:sub+iva};
}
function preCodigo(){
  var cli = (PRE.cliente||'CLIENTE').toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Z0-9]/g,'').slice(0,18);
  var codes = []; selLines().forEach(function(i){ if(codes.indexOf(i.code)<0) codes.push(i.code); });
  return 'EXP-2026-'+cli+'-'+(codes.join('')||'GEN');
}
function preTitulo(){
  if(PRE.titulo) return PRE.titulo;
  var c = selLines().map(function(i){ return i.code; });
  var voz = c.indexOf('VOZ')>-1, wsp = c.indexOf('WSP')>-1, tri = c.indexOf('360')>-1;
  if(voz&&wsp) return 'Propuesta de automatización de la gestión de citas · Asistente de voz IA + asistente de WhatsApp';
  if(voz) return 'Propuesta de automatización telefónica · Asistente de voz IA';
  if(wsp) return 'Propuesta de automatización de mensajería · Asistente de WhatsApp';
  if(tri) return 'Propuesta de implantación · Labs Command Center 360™';
  return 'Propuesta de automatización e inteligencia artificial aplicada';
}

    if(!T.L.length){ toast('Añade al menos un servicio del catálogo.'); return; }
    PRE.num++;
    DB.quotes.unshift({id:'P-2026-'+PRE.num, cli:PRE.cliente,
      srv:T.L.length+' módulos · '+(T.L[0].code==='VOZ'?'Voz IA':'Automatización'),
      v:T.tot, st:'Enviado', d:new Date().toLocaleDateString('es-ES')});
    toast('Presupuesto '+preCodigo()+' registrado y enviado a Back Office.');
    renderApp();
  };
}

</script>
</body>
